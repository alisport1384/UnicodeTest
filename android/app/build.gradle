plugins { id 'com.android.application' }

android {
    namespace 'ai.p6tx.lab'
    compileSdk 35
    defaultConfig {
        applicationId 'ai.p6tx.lab'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.4'
    }
    sourceSets.main.assets.srcDirs = [layout.buildDirectory.dir('generated/web-assets')]
}

dependencies { implementation 'androidx.webkit:webkit:1.12.1' }

tasks.register('copyWebAssets', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html', 'style.css', 'app.js', 'codec.js', 'profile.js'
    }
    into layout.buildDirectory.dir('generated/web-assets')
}
tasks.named('preBuild').configure { dependsOn tasks.named('copyWebAssets') }
